[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-days-downloader"
version = "1.0.0"
description = "Download the freely readable pages of a comic-days.com manga episode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "codewithbalaji" },
]
keywords = ["comic-days", "manga", "downloader", "scraper"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/codewithbalaji/comic-days-downloader"
Issues = "https://github.com/codewithbalaji/comic-days-downloader/issues"

[project.scripts]
comic-days-downloader = "comic_days_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
